<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Monogram Royal Blue into Cyan Gradient -->
    <linearGradient id="ic-letter-grad" x1="6" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Checkmark accent Teal into Emerald -->
    <linearGradient id="ic-check-accent" x1="26" y1="26" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Stylized Letter 'I' (Document/Ledger Column) -->
  <rect x="8" y="10" width="12" height="44" rx="4" fill="url(#ic-letter-grad)" />
  <!-- 'I' Document ledger horizontal notches -->
  <rect x="11" y="17" width="6" height="2.5" rx="1" fill="#FFFFFF" fill-opacity="0.85" />
  <rect x="11" y="24" width="6" height="2.5" rx="1" fill="#FFFFFF" fill-opacity="0.85" />
  <rect x="11" y="31" width="6" height="2.5" rx="1" fill="#FFFFFF" fill-opacity="0.85" />

  <!-- Stylized Letter 'C' (Crafting arc with folded checkmark flourish) -->
  <path
    d="M48 18C44.5 13 38 10 30 10C19.5 10 14 18 14 32C14 46 20.5 54 31 54C39 54 45.5 50.5 49 44"
    stroke="url(#ic-letter-grad)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Embedded Checkmark dynamically interacting with the 'C' -->
  <path
    d="M29 32L35 38L52 18"
    stroke="url(#ic-check-accent)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
